name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 测试只依赖 Node 内置模块，跳过 Electron 二进制下载，CI 更快。
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test
