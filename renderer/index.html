<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>盯盘</title>
  <link rel="stylesheet" href="style.css" />
  <script src="boot.js"></script>
</head>
<body>
  <!-- 左列 = 原来的浮窗（周期标识 + 自选列表），聚焦时宽度不变，图表往右边长出来 -->
  <div id="left">
    <div id="head"><span id="period-label">分时</span></div>
    <div id="app"></div>
  </div>
  <!-- 可拖动的分界线：左右拉，决定列表和图表各占多宽 -->
  <div id="splitter"></div>
  <div id="focus">
    <div id="focus-head">
      <span id="f-name">--</span>
      <span id="f-zoom"></span>
      <span id="f-tabs">
        <!-- 分时级别下拉放在「分时」左边：点开选 5/15/30/60 分钟，选完立刻换图 -->
        <span id="f-level" role="button" tabindex="0" title="分时级别">
          <span id="f-level-cur">5分</span><span class="caret">▾</span>
        </span>
        <button type="button" data-tab="minute">分时</button>
        <button type="button" data-tab="five">5日</button>
        <button type="button" data-tab="day">日K</button>
        <button type="button" data-tab="week">周K</button>
        <button type="button" data-tab="month">月K</button>
      </span>
    </div>
    <div id="chart"></div>
    <!-- 鼠标贴到图表左右边缘时出现，停住就自动往那个方向平移；纯视觉提示，不吃鼠标事件 -->
    <div class="edge-arrow" id="edge-l" aria-hidden="true"></div>
    <div class="edge-arrow" id="edge-r" aria-hidden="true"></div>
  </div>
  <!-- 分时级别下拉。必须挂在 body 上：聚焦栏 #focus 带 transform 动画 + overflow:hidden，
       放在里面会让 position:fixed 以它为参照系并被裁掉（和 #group-menu 同理） -->
  <div id="f-level-menu" role="menu"></div>
  <script src="app.js"></script>
  <script src="chart.js"></script>
</body>
</html>
